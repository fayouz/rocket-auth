parameters:
    # OpenID Connect provider: issuer (public URL of this API), signing key, token lifetimes (seconds).
    env(OIDC_ISSUER): 'http://localhost:8100'
    env(OIDC_PRIVATE_KEY): '%kernel.project_dir%/config/jwt/oidc-private.pem'
    env(OIDC_ACCESS_TOKEN_TTL): '900'
    env(OIDC_ID_TOKEN_TTL): '3600'
    env(OIDC_REFRESH_TOKEN_TTL): '2592000'
    env(FRONTEND_URL): 'http://localhost:3100'
    env(UPDATE_REPOSITORY): 'fayouz/rocket-auth'
    # Demo OAuth clients (app:demo:seed): "clientId|Name|secret|redirect URI|post-logout URI", separated by ";".
    env(DEMO_OAUTH_CLIENTS): ''

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

when@test:
    services:
        App\Tests\Support\HttpMock: ~
